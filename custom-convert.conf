# Lyphile: Matroska files played by VLC, the audio converted by ffmpeg (vlc-Player)
#
# The file type "mkv" (suffixes mkv, mka, mk3d, server type audio) is defined by PlayMKV, and
# PlayMKV has its own rules for it that call ffmpeg directly. Lyrion keeps a rule defined twice
# as a second instance and tries the profiles of a format in this order:
#
#   mkv-<format>-<player model>-<MAC>     most specific
#   mkv-<format>-*-<MAC>                  <- the rules below
#   mkv-<format>-<player model>-*
#   mkv-<format>-*-*                      <- PlayMKV's rules
#
# so a rule written for one player's MAC is used before PlayMKV's, and nothing in PlayMKV has to
# change. Players without a rule here keep playing through PlayMKV.
#
# The test player: 66:d4:19:ad:25:10. To use another one, replace the MAC address in the lines
# that start with "mkv" (four of them), lower case and with colons. After any change, restart
# Lyrion: it reads this file only at start.
#
# Capabilities of vlc-Player: F = reads a named file, T = starts at a time (-s), U = stops after a
# duration (-d). No I: it cannot read from stdin. First iteration: vlc-Player plays at most 30 s.
#
# To try vlc-Player's second mode (VLC plays through its own audio output, so the volume, equalizer
# and rate controls of the player page work), add -M aout to the command of a rule, for example:
#     [vlc-Player] -m $CLIENTID$ -M aout -f flac $START$ $END$ $PATH$
# The default (no -M) is the stream-output mode.
#
# $FILE$ is the path of the source file; $CLIENTID$ the player's MAC address.

mkv flc * ae:40:15:93:94:77
    # F:{PATH=%f}T:{START=-s %s}U:{END=-d %w}
    [vlc-Player] -m $CLIENTID$ -M aout -f flac $START$ $END$ $PATH$

mkv pcm * ae:40:15:93:94:77
    # F:{PATH=%f}T:{START=-s %s}U:{END=-d %w}
    [vlc-Player] -m $CLIENTID$ -f pcm $START$ $END$ $PATH$

mkv wav * ae:40:15:93:94:77
    # F:{PATH=%f}T:{START=-s %s}U:{END=-d %w}
    [vlc-Player] -m $CLIENTID$ -f wav $START$ $END$ $PATH$

mkv mp3 * ae:40:15:93:94:77
    # F:{PATH=%f}T:{START=-s %s}U:{END=-d %w}B:{BITRATE=-B %B}
    [vlc-Player] -m $CLIENTID$ -f mp3 $START$ $END$ $BITRATE$ $PATH$

# DVD: the types "dvd" (suffix vob) and "iso" (suffixes iso, img) come from PlayDVD, which has
# its own rules for them (DVD-Transcode). The rules below, for the test player only, win in the same
# way. The source is a dvd:///path/to/disc.iso?title=N[&chapter=C] URL for a disc title, a plain
# path for an image played without a title; vlc-Player handles both (see its header).
# R = the source may be an URL, as PlayDVD declares it.

dvd flc * ae:40:15:93:94:77
    # F:{PATH=%f}R:{PATH=%F}T:{START=-s %s}U:{END=-d %w}
    [vlc-Player] -m $CLIENTID$ -f flac $START$ $END$ $FILE$

dvd pcm * ae:40:15:93:94:77
    # F:{PATH=%f}R:{PATH=%F}T:{START=-s %s}U:{END=-d %w}
    [vlc-Player] -m $CLIENTID$ -f pcm $START$ $END$ $FILE$

dvd wav * ae:40:15:93:94:77
    # F:{PATH=%f}R:{PATH=%F}T:{START=-s %s}U:{END=-d %w}
    [vlc-Player] -m $CLIENTID$ -f wav $START$ $END$ $FILE$

dvd mp3 * ae:40:15:93:94:77
    # F:{PATH=%f}R:{PATH=%F}T:{START=-s %s}U:{END=-d %w}B:{BITRATE=-B %B}
    [vlc-Player] -m $CLIENTID$ -f mp3 $START$ $END$ $BITRATE$ $FILE$

iso flc * ae:40:15:93:94:77
    # F:{PATH=%f}R:{PATH=%F}T:{START=-s %s}U:{END=-d %w}
    [vlc-Player] -m $CLIENTID$ -f flac $START$ $END$ $FILE$

iso pcm * ae:40:15:93:94:77
    # F:{PATH=%f}R:{PATH=%F}T:{START=-s %s}U:{END=-d %w}
    [vlc-Player] -m $CLIENTID$ -f pcm $START$ $END$ $FILE$

iso wav * ae:40:15:93:94:77
    # F:{PATH=%f}R:{PATH=%F}T:{START=-s %s}U:{END=-d %w}
    [vlc-Player] -m $CLIENTID$ -f wav $START$ $END$ $FILE$

iso mp3 * ae:40:15:93:94:77
    # F:{PATH=%f}R:{PATH=%F}T:{START=-s %s}U:{END=-d %w}B:{BITRATE=-B %B}
    [vlc-Player] -m $CLIENTID$ -f mp3 $START$ $END$ $BITRATE$ $FILE$
